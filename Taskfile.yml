version: '3'

vars:
  REFERENCE: '/app/persistent/outputs/refine-reference.png'
  REFINE_PROMPT: 'Keep the glass robot and orchids, but change the lighting to warm golden sunset.'
  REFINE_RESOLUTIONS: '1024x1024'
  WIDTH: '1024'
  HEIGHT: '1024'
  SEED: '12345'
  STEPS: '4'
  RUNS: '5'
  WARMUPS: '2'
  TIMEOUT: '180'
  SUITE: 'speed'
  SUMMARY: 'latest'
  SEED_RESOLUTIONS: '512x512,1024x1024,1536x1536'
  PLAN_RESOLUTIONS: '{{if eq .SUITE "fixed-seed"}}{{.SEED_RESOLUTIONS}}{{else}}{{.RESOLUTIONS}}{{end}}'
  ALLOC_CONF: 'expandable_segments:True'
  REPORT: 'benchmarks/history/allocator-comparison/resolution-expandable.json'
  CHART: 'benchmarks/resolution-expandable.svg'
  RESOLUTIONS: '512x512,768x768,1024x1024,1280x1280,1536x1024,1024x1536,1920x1088,1088x1920,1536x1536'
  CAPACITY_RESOLUTIONS: '1024x1024,1280x1280,1536x1536,1792x1792,1856x1856,1920x1920,2048x2048,2304x2304,2560x2560,2816x2816,3072x3072'

tasks:
  ui:
    desc: Start the browser studio at http://localhost:7860
    cmds: [docker compose up -d]

  ui:logs:
    desc: Follow studio service logs
    cmds: [docker compose logs -f studio]

  api:check:
    desc: Inspect readiness, models, named resolutions and MCP tools without loading weights
    cmds: [docker compose exec -T studio python tools/probe_agent_api.py]

  api:smoke:
    desc: Generate matching 1024 images over HTTP and MCP, verify pixels and remove own test jobs
    cmds: [docker compose exec -T studio python tools/probe_agent_api.py --generate]

  api:queue:
    desc: Verify five concurrent HTTP/MCP calls plus two-image batches at 1024 (nine images total)
    cmds: [docker compose exec -T studio python tools/probe_queue.py]

  api:refine:
    desc: Verify text generation, paired two-image HTTP/MCP edits and iterative reuse at 1024
    cmds: [docker compose exec -T studio python tools/probe_refine.py]

  refine:references:plan:
    desc: Describe fixed-1024 multi-reference memory or visual checks without inference
    cmds: ['docker compose exec -T studio python tools/probe_multiref.py --suite {{.REFERENCE_SUITE | default "memory"}} --plan {{.CLI_ARGS}}']

  refine:references:fixtures:
    desc: Create four synthetic fictional-person views for reference testing
    cmds: [docker compose run --rm --entrypoint python studio tools/probe_multiref.py --suite fixtures]

  refine:references:memory:
    desc: Measure one/two/four references at fixed 1024 output, in fresh workers
    cmds: ['docker compose run --rm --entrypoint python studio tools/probe_multiref.py --suite memory {{.CLI_ARGS}}']

  refine:references:quality:
    desc: Compare likeness with one/two/four references and a same-seed repeat
    cmds: ['docker compose run --rm --entrypoint python studio tools/probe_multiref.py --suite quality {{.CLI_ARGS}}']

  refine:references:report:
    desc: Regenerate multi-reference reports and root memory SVG from retained evidence (no GPU)
    requires:
      vars: [REFERENCE_REPORT]
    cmds: ['uv run --no-project --python 3.13 python tools/report_multiref.py "{{.REFERENCE_REPORT}}"']

  api:resolutions:
    desc: Generate each named API size and verify its output (workflow check, not a benchmark)
    cmds: [docker compose exec -T studio python tools/probe_agent_api.py --all-resolutions]

  default:
    cmds: [task --list]

  docker:build:
    desc: Build the local runtime image
    aliases: [build]
    cmds: [docker compose build]

  doctor:
    desc: Check GPU access and runtime versions
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio doctor

  model:download:
    desc: Download the pinned model into the persistent volume
    cmds: [docker compose run --rm studio download]

  generate:
    desc: Generate one image; pass a prompt after -- or set WIDTH/HEIGHT/SEED
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio generate --width {{.WIDTH}} --height {{.HEIGHT}} --seed {{.SEED}} --steps {{.STEPS}} {{.CLI_ARGS}}

  lora:pixel-art:
    desc: Generate a 1024-default pixel-art example with the experimental pinned LoRA
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio generate --lora pixel-art --lora-strength {{.STRENGTH | default "1"}} --width {{.WIDTH}} --height {{.HEIGHT}} --seed {{.SEED}} --steps {{.STEPS}} --prompt "pixel art sprite, a brave knight in shining armor holding a sword and shield, full body, game asset, solid green screen background, flat uniform green background, isolated character" {{.CLI_ARGS}}

  lora:check:
    desc: Generate three matched LoRA comparisons, repeat/zero/removal controls and local HTML review
    cmds:
      - docker compose run --rm --entrypoint python studio tools/probe_lora.py {{.CLI_ARGS}}

  lora:koni-anime:
    desc: Generate a 1024-default anime illustration with the pinned Koni LoRA
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio generate --lora koni-anime --lora-strength {{.STRENGTH | default "1"}} --width {{.WIDTH}} --height {{.HEIGHT}} --seed {{.SEED}} --steps {{.STEPS}} --prompt "anime_style, an adult traveler with a red backpack in a snowy mountain village at night, warm window lights" {{.CLI_ARGS}}

  lora:koni-check:
    desc: Compare three Koni/base pairs and repeat/zero/removal controls at 1024
    cmds:
      - docker compose run --rm --entrypoint python studio tools/probe_lora.py --adapter koni-anime {{.CLI_ARGS}}

  lora:nasa-concept:
    desc: Generate a retro space concept at 1024 by default with the pinned NASA adapter
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio generate --lora nasa-concept --lora-strength {{.STRENGTH | default "0.5"}} --width {{.WIDTH}} --height {{.HEIGHT}} --seed {{.SEED}} --steps {{.STEPS}} --prompt "NASA_CONCEPT retro-futuristic space concept art of a rotating wheel space station above the Moon, painted technical illustration" {{.CLI_ARGS}}

  lora:nasa-check:
    desc: Compare three NASA/base pairs and repeat/zero/removal controls at 1024
    cmds:
      - docker compose run --rm --entrypoint python studio tools/probe_lora.py --adapter nasa-concept {{.CLI_ARGS}}

  lora:outpaint-check:
    desc: Compare base/Green Fill on borders and interior marks at 1024; set REFERENCE to an image
    cmds:
      - docker compose run --rm --entrypoint python studio tools/probe_outpaint.py --reference "{{.REFERENCE}}" {{.CLI_ARGS}}

  lora:zoom-check:
    desc: Compare base/Red Zoom on two rectangles, repeat/removal and iterative zoom at 1024
    cmds:
      - docker compose run --rm --entrypoint python studio tools/probe_zoom.py --reference "{{.REFERENCE}}" {{.CLI_ARGS}}

  benchmark:
    desc: Measure warmed speed at one resolution (no VRAM sampling or seed assertion)
    aliases: [bench]
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio benchmark --offline --width {{.WIDTH}} --height {{.HEIGHT}} --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} {{.CLI_ARGS}}

  benchmark:resolutions:
    desc: Measure speed per size in fresh processes and update speed reports
    aliases: ['bench:resolutions', 'benchmark:speed', 'bench:speed']
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio resolution-sweep --suite speed --offline --resolutions {{.RESOLUTIONS}} --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} --timeout {{.TIMEOUT}} {{.CLI_ARGS}}

      - task: benchmark:report
        vars: {SUITE: speed}

  benchmark:capacity:
    desc: Increase square resolution until OOM, timeout or less than 512 MiB sampled headroom
    aliases: ['bench:capacity']
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio resolution-sweep --suite memory --offline --stop-on-limit --resolutions {{.CAPACITY_RESOLUTIONS}} --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} --timeout {{.TIMEOUT}} {{.CLI_ARGS}}

      - task: benchmark:report
        vars: {SUITE: memory}

  benchmark:memory:
    desc: Measure loading and generation VRAM per size and update memory reports
    aliases: ['bench:memory']
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio resolution-sweep --suite memory --offline --resolutions {{.RESOLUTIONS}} --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} --timeout {{.TIMEOUT}} {{.CLI_ARGS}}
      - task: benchmark:report
        vars: {SUITE: memory}

  benchmark:presets:plan:
    desc: Show the memory workload for all named agent sizes without loading a model
    cmds:
      - docker run --rm --network none flux2-klein-studio:dev resolution-sweep --suite memory --named-resolutions --runs {{.RUNS}} --warmups {{.WARMUPS}} --seed {{.SEED}} --steps {{.STEPS}} --timeout {{.TIMEOUT}} --plan {{.CLI_ARGS}}

  benchmark:presets:
    desc: Stop the studio, benchmark all named sizes, update reference VRAM and rebuild/restart the studio
    cmds:
      - docker compose stop studio
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio resolution-sweep --suite memory --named-resolutions --offline --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} --timeout {{.TIMEOUT}} {{.CLI_ARGS}}
      - task: benchmark:report
        vars: {SUITE: memory}
      - task: benchmark:presets:export
        vars: {CLI_ARGS: ''}
      - task: docker:build
      - task: ui

  benchmark:presets:export:
    desc: Build the studio's portable VRAM reference from the latest archived memory run (no inference)
    deps: ['tools:build']
    cmds:
      - docker run --rm --mount "type=bind,source={{.ROOT_DIR}},target=/work" --entrypoint python flux2-klein-studio:tools tools/export_preset_memory.py {{.CLI_ARGS}}

  benchmark:seed:
    desc: Test same-seed pixels, changed inputs and fresh-process reproduction
    aliases: ['bench:seed']
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio resolution-sweep --suite fixed-seed --offline --resolutions {{.SEED_RESOLUTIONS}} --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} --timeout {{.TIMEOUT}} {{.CLI_ARGS}}
      - task: benchmark:report
        vars: {SUITE: fixed-seed}

  benchmark:full:
    desc: Run memory, speed and fixed-seed suites sequentially with separate reports
    aliases: ['bench:full']
    cmds:
      - task: benchmark:memory
      - task: benchmark:resolutions
      - task: benchmark:seed

  benchmark:plan:
    desc: Show a suite workload without GPU access, model loading or report writes
    cmds:
      - docker run --rm --network none -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} flux2-klein-studio:dev resolution-sweep --suite {{.SUITE}} --resolutions {{.PLAN_RESOLUTIONS}} --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} --timeout {{.TIMEOUT}} --plan {{.CLI_ARGS}}

  benchmark:smoke:
    desc: Run one-size suite wiring check, keeping raw evidence without public report writes
    aliases: ['bench:smoke']
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio resolution-sweep --suite {{.SUITE}} --offline --resolutions {{.WIDTH}}x{{.HEIGHT}} --seed {{.SEED}} --steps {{.STEPS}} --runs 2 --warmups 1 --timeout {{.TIMEOUT}} {{.CLI_ARGS}}

  benchmark:report:
    desc: Archive a portable run and rebuild its report and root SVG (no inference)
    deps: ['tools:build']
    cmds:
      - docker run --rm --mount "type=bind,source={{.ROOT_DIR}},target=/work" --entrypoint python flux2-klein-studio:tools tools/report_benchmarks.py --suite {{.SUITE}} --input "{{.SUMMARY}}" --plot

  docker:test-build:
    desc: Build test image and run CPU guards (GPU tests explicitly skipped)
    aliases: ['test:cpu', test]
    cmds: [docker build --target test -t flux2-klein-studio:test .]

  test:gpu:
    desc: Run numerical GPU tests using the test image
    cmds:
      - task: docker:test-build
      - docker run --rm --gpus all -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} --mount type=volume,source=flux2_klein_studio_data,target=/app/persistent --entrypoint python flux2-klein-studio:test -m unittest discover -s tests -v

  tools:build:
    desc: Build optional lint/plot tools separately from the inference image
    cmds: [docker build --target tooling -t flux2-klein-studio:tools .]

  lint:
    desc: Check Python code and formatting with the pinned container tools
    deps: ['tools:build']
    cmds:
      - docker run --rm --mount "type=bind,source={{.ROOT_DIR}},target=/work" flux2-klein-studio:tools check src tests tools
      - docker run --rm --mount "type=bind,source={{.ROOT_DIR}},target=/work" flux2-klein-studio:tools format --check src tests tools

  format:
    desc: Format Python sources using the pinned container tool
    deps: ['tools:build']
    cmds:
      - docker run --rm --mount "type=bind,source={{.ROOT_DIR}},target=/work" flux2-klein-studio:tools format src tests tools

  benchmark:plot:
    desc: Render the selected benchmark JSON as an SVG chart
    aliases: ['bench:plot']
    deps: ['tools:build']
    cmds:
      - docker run --rm --mount "type=bind,source={{.ROOT_DIR}},target=/work" --entrypoint python flux2-klein-studio:tools tools/plot_benchmark.py "{{.REPORT}}" "{{.CHART}}"

  cli:
    desc: Forward arguments directly to the container CLI
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio {{.CLI_ARGS}}

  docker:down:
    desc: Remove project containers/network while preserving model caches
    cmds: [docker compose down]


  docker:build:tiny:
    desc: Build the local download-on-first-use image (no registry push)
    cmds: [docker build --target tiny -t flux2-klein-studio:tiny .]

  docker:build:full:
    desc: Build the local full image with pinned model/kernel assets (no registry push)
    cmds: [docker build --target baked -t flux2-klein-studio:full .]

  docker:evidence:
    desc: Export runtime notices and model/source manifests into ignored .ci-build
    cmds:
      - docker build --target evidence --output type=local,dest=.ci-build/evidence .

  validate:
    env:
      PYTHONPATH: "{{.ROOT_DIR}}/src"
    desc: Run lightweight source, version, publication and release transition checks
    cmds:
      - uv run --no-project --python 3.13 --with ruff==0.16.10 ruff check src tests tools
      - uv run --no-project --python 3.13 --with ruff==0.16.10 ruff format --check src tests tools
      - uv run --no-project --python 3.13 python tools/check_release.py
      - uv run --no-project --python 3.13 python -m unittest discover -s tests -p test_publication.py -v

  release:dry-run:
    desc: Validate promotion and the next snapshot in memory, without changing refs or files
    cmds:
      - uv run --no-project --python 3.13 python tools/release.py --dry-run {{.CLI_ARGS}}

  release:
    desc: Promote snapshot, create annotated tag and next snapshot, atomically push refs (publishes via CI)
    cmds:
      - uv run --no-project --python 3.13 python tools/release.py {{.CLI_ARGS}}


  benchmark:refine:plan:
    desc: Plan reference-image measurements without GPU access or report writes
    cmds:
      - docker run --rm --network none --mount "type=bind,source={{.ROOT_DIR}}/outputs,target=/app/persistent/outputs,readonly" flux2-klein-studio:dev resolution-sweep --suite {{.SUITE}} --reference-image "{{.REFERENCE}}" --prompt "{{.REFINE_PROMPT}}" --resolutions {{.REFINE_RESOLUTIONS}} --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} --timeout {{.TIMEOUT}} --plan

  benchmark:refine:memory:
    desc: Measure reference-edit VRAM separately from the text-only baseline
    cmds:
      - task: benchmark:refine:suite
        vars: {SUITE: memory}

  benchmark:refine:speed:
    desc: Measure warmed reference-edit speed without VRAM sampling
    cmds:
      - task: benchmark:refine:suite
        vars: {SUITE: speed}

  benchmark:refine:seed:
    desc: Verify edit seeds, instruction/reference changes and a fresh worker
    cmds:
      - task: benchmark:refine:suite
        vars: {SUITE: fixed-seed}

  benchmark:refine:suite:
    internal: true
    cmds:
      - docker compose run --rm -e PYTORCH_ALLOC_CONF={{.ALLOC_CONF}} studio resolution-sweep --offline --suite {{.SUITE}} --reference-image "{{.REFERENCE}}" --prompt "{{.REFINE_PROMPT}}" --resolutions {{.REFINE_RESOLUTIONS}} --seed {{.SEED}} --steps {{.STEPS}} --runs {{.RUNS}} --warmups {{.WARMUPS}} --timeout {{.TIMEOUT}} --output-dir /app/persistent/outputs/refine {{.CLI_ARGS}}
      - task: tools:build
      - docker run --rm --mount "type=bind,source={{.ROOT_DIR}},target=/work" --entrypoint python flux2-klein-studio:tools tools/report_benchmarks.py --suite {{.SUITE}} --artifacts outputs/refine/benchmarks --profile refine --plot

  benchmark:refine:full:
    desc: Run reference-edit memory, speed and correctness suites sequentially
    cmds:
      - task: benchmark:refine:memory
      - task: benchmark:refine:speed
      - task: benchmark:refine:seed

  benchmark:refine:report:
    desc: Regenerate editing reports and root SVG from local or archived evidence (no inference)
    deps: ['tools:build']
    cmds:
      - docker run --rm --mount "type=bind,source={{.ROOT_DIR}},target=/work" --entrypoint python flux2-klein-studio:tools tools/report_benchmarks.py --suite {{.SUITE}} --input "{{.SUMMARY}}" --artifacts outputs/refine/benchmarks --profile refine --plot
