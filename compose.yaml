services:
  studio:
    image: ${STUDIO_IMAGE:-flux2-klein-studio:dev}
    build:
      context: .
      target: ${STUDIO_BUILD_TARGET:-tiny}
    gpus: all
    init: true
    environment:
      STUDIO_OFFLINE: ${STUDIO_OFFLINE:-}
      STUDIO_QUEUE_LIMIT: ${STUDIO_QUEUE_LIMIT:-64}
      STUDIO_QUEUE_TIMEOUT_SECONDS: ${STUDIO_QUEUE_TIMEOUT_SECONDS:-900}
      STUDIO_API_KEY: ${STUDIO_API_KEY:-}
      STUDIO_ALLOWED_HOSTS: "${STUDIO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],testserver}"
    volumes:
      - data:/app/persistent
      - ./outputs:/app/persistent/outputs
    ports:
      - "127.0.0.1:7860:7860"
    command: [serve]

volumes:
  data:
    name: ${STUDIO_DATA_VOLUME:-flux2_klein_studio_data}
