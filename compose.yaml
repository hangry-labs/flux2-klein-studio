services:
  studio:
    image: flux2-klein-studio:dev
    build:
      context: .
      target: runtime
    gpus: all
    init: true
    environment:
      STUDIO_OFFLINE: ${STUDIO_OFFLINE:-0}
      STUDIO_API_KEY: ${STUDIO_API_KEY:-}
      STUDIO_ALLOWED_HOSTS: "${STUDIO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],testserver}"
    volumes:
      - data:/data
      - ./outputs:/data/outputs
    ports:
      - "127.0.0.1:7860:7860"
    command: [serve]

volumes:
  data:
    name: flux2-klein-studio-data
